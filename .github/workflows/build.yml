name: Build native app (Flutter)

on:
  # Manual trigger only (workflow_dispatch); runs from main — native-dev was
  # merged into main, so the branch no longer needs its own build.
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (feature switches)'
        type: choice
        default: 'play'
        options: ['play', 'fdroid', 'dev']
      build_type:
        description: 'APK type'
        type: choice
        default: 'debug'
        options: ['debug', 'release']
      build_ios:
        description: 'Also compile the iOS runner (macOS, no codesign)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # secrets is NOT available inside `if:` expressions — expose the
      # presence of the signing key through env, then gate the decode
      # step on it (empty/absent secret → 'false', no error).
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      # Signing vars passed NATIVELY (like main's playstore.yml step env),
      # NOT echoed into GITHUB_ENV: bash would interpret $ / backticks /
      # backslashes inside the secret values and mangle the password
      # ("keystore password was incorrect" on a valid key). They are
      # inert unless the decode step sets IS_GITHUB_ACTION=true.
      SIGNING_KEY_FILE: release-keystore.jks
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        # On push every flavor is built (they share one compile step after
        # the first, so the extra cost is small). Each flavor's feature
        # switches are applied as --dart-define at build time.
        flavor: [play, fdroid, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── F-Droid reference-binary env alignment ──────────────────────────
      # The pipe (fdroidserver buildserver-trixie image) rebuilds the same
      # commit and byte-compares against the binary we publish. tool/
      # fdroid_build.sh already makes the pipe build at the SAME absolute
      # path as Actions (the /home/runner/work/... mv), so the remaining
      # byte-level deltas are environment paths embedded in NDK-built .so
      # files and dex: pub-cache location, SDK/NDK location, flutter SDK
      # location, and the JDK. These steps align the fdroid job to the
      # buildserver image (ANDROID_HOME=/opt/android-sdk, JDK 21 via
      # default-jdk-headless on Debian trixie, srclib flutter at
      # /home/vagrant/build/srclib/flutter, pub cache inside the checkout).
      - name: Align Android SDK path (F-Droid buildserver)
        if: matrix.flavor == 'fdroid'
        run: |
          sudo ln -sfn "$ANDROID_HOME" /opt/android-sdk
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.pub-cache" >> "$GITHUB_ENV"

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Align flutter SDK path (F-Droid buildserver)
        if: matrix.flavor == 'fdroid'
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          sudo mkdir -p /home/vagrant/build/srclib
          sudo ln -sfn "$FLUTTER_ROOT" /home/vagrant/build/srclib/flutter
          echo "/home/vagrant/build/srclib/flutter/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 21 (match F-Droid buildserver)
        if: matrix.flavor == 'fdroid'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test

      # Upload signing key, exactly like the wrapper (main branch):
      # SIGNING_KEY (base64 keystore) + KEY_STORE_PASSWORD / ALIAS /
      # KEY_PASSWORD secrets, decoded to android/app/release-keystore.jks
      # and consumed via IS_GITHUB_ACTION / SIGNING_KEY_FILE. Signs EVERY
      # release build — play, fdroid and dev APKs plus the play AAB.
      # Secrets absent → release builds stay unsigned (the wrapper's
      # fdroid-style fallback) and the pipeline never breaks.
      - name: Decode Keystore File
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > android/app/release-keystore.jks
          echo "IS_GITHUB_ACTION=true" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          # ── Global build-step feature switches (AppConfig) ──────────────
          # Every flavor is defined here; the app reads them at compile time
          # via String.fromEnvironment / bool.fromEnvironment. Add a switch:
          # add the --dart-define line in the right flavor block, then use
          # AppConfig.<name> in code.
          DEFINES="--dart-define=ENCLAVD_FLAVOR=${{ matrix.flavor }}"
          BUILD_FLAGS=""
          if [ "${{ matrix.flavor }}" = "play" ]; then
            # Play Store build: full features, production API.
            DEFINES="$DEFINES --dart-define=ENCLAVD_FEATURE_NOTIFICATIONS=true --dart-define=ENCLAVD_FEATURE_CHAT=true --dart-define=ENCLAVD_FEATURE_SEARCH=true"
          fi
          if [ "${{ matrix.flavor }}" = "fdroid" ]; then
            # F-Droid build: NO Google Play services — no FCM (the app
            # skips FCM at compile time via AppConfig.enableFcm).
            # Notifications run on Unified Push when a distributor app
            # (ntfy, Conversations, NextPush) is installed, else the
            # 15-minute polling fallback. Same production API otherwise.
            DEFINES="$DEFINES --dart-define=ENCLAVD_FEATURE_NOTIFICATIONS=true --dart-define=ENCLAVD_FEATURE_CHAT=true --dart-define=ENCLAVD_FEATURE_SEARCH=true"
            # F-Droid requires per-ABI APKs (their request, Oct 2026). The
            # pipe (tool/fdroid_build.sh) builds with --split-per-abi, so the
            # reference binary MUST too — same flags, same bytes. Outputs:
            # app-<abi>-fdroid-release.apk (version codes base*10 + abi via
            # build.gradle.kts; Flutter's own *1000 scheme disabled by
            # force-version-code-ignoring-abi in gradle.properties).
            BUILD_FLAGS="$BUILD_FLAGS --split-per-abi"
            # Build-input parity with the pipe (fdroid-reproducibility.md):
            # strip the firebase plugin modules the way fdroid_build.sh does
            # (identical plugin list = identical .flutter-plugins-dependencies
            # = identical gradle configuration = identical dex), and --no-pub
            # so flutter build does NOT re-run pub get and regenerate the
            # file, undoing the strip.
            python3 tool/strip_firebase.py
            BUILD_FLAGS="$BUILD_FLAGS --no-pub"
          fi
          if [ "${{ matrix.flavor }}" = "dev" ]; then
            # Dev build: same production API as every flavor — the app ALWAYS
            # talks to enclavd.com (a phone can't reach a local dev box).
            # Debug builds give hot reload + full logging; nothing else differs.
            DEFINES="$DEFINES --dart-define=ENCLAVD_FEATURE_NOTIFICATIONS=true"
          fi

          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            # Debug only via workflow_dispatch (JIT: good for hot-reload
            # iteration, feels laggy on-device — never the push default).
            flutter build apk --flavor "${{ matrix.flavor }}" --debug $DEFINES
          else
            # Release by default: the push-built APK is what gets installed
            # on phones. AOT-compiled, no IME/typing jank. --flavor selects
            # the gradle product flavor (native dependency set — fdroid
            # excludes the firebase plugins); the dart-defines drive the
            # app's compile-time config.
            flutter build apk --flavor "${{ matrix.flavor }}" --release $BUILD_FLAGS $DEFINES
          fi
          # Hand the defines to the AAB step (release, play flavor only).
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"

      # AGP writes a "Dependency metadata" entry (block ID 0x504b4453) into
      # the APK signing block for Play; the F-Droid pipe's binary check flags
      # it as an extra signing block. Strip it here — v2/v3 signatures do NOT
      # cover the signing block, so the signature stays valid (the next step
      # verifies it), and zip entries are untouched, so the byte comparison
      # with the pipe's build is unaffected (the pipe strips identically via
      # tool/fdroid_build.sh).
      - name: Strip AGP dependency metadata (F-Droid pipe)
        if: matrix.flavor == 'fdroid'
        run: |
          # Split-per-abi build → one APK per ABI; strip the signing-block
          # entry from each (the pipe strips identically via tool/fdroid_build.sh).
          for APK in build/app/outputs/flutter-apk/app-*-fdroid-release.apk; do
            python3 tool/strip_dep_metadata.py "$APK"
          done

      # F-Droid acceptance gate: the fdroid APK must contain NO Google
      # code. Grep the dex classes + merged manifest for firebase /
      # play-services references and fail the build if any survive the
      # flavor exclusions.
      - name: Verify fdroid APK is GMS-free
        if: matrix.flavor == 'fdroid'
        run: |
          # Split-per-abi: scan EVERY per-ABI APK (app-<abi>-fdroid-release.apk).
          FAILED=0
          for APK in build/app/outputs/flutter-apk/app-*-fdroid-release.apk; do
            echo "checking $APK"
            # Scan EVERY dex file (play-core landed in classes4.dex last time —
            # a classes.dex-only grep would have missed it) for google code.
            # firebase/gms = real google code; play/core refs are the engine's
            # dead references (PlayStoreDeferredComponentManager), which the
            # StripPlayStoreDeferredManager instrumentation empties on the
            # fdroid variant — so play refs must be ZERO here too. If either
            # shows up, the fdroid APK is not Google-free.
            HITS=$(for f in $(unzip -l "$APK" | grep -oE 'classes[0-9]*\.dex'); do unzip -p "$APK" "$f"; done | grep -cE "Lcom/google/firebase|Lcom/google/android/gms|Lcom/google/android/play" || true)
            MANIFEST=$(unzip -p "$APK" AndroidManifest.xml | grep -c "firebase" || true)
            echo "google refs across all dex: $HITS | manifest firebase refs: $MANIFEST"
            if [ "$HITS" -gt 0 ] || [ "$MANIFEST" -gt 0 ]; then
              echo "FAIL: fdroid APK contains Google/Firebase references"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "fdroid APKs are GMS-free: OK"

      # Release gate: the fdroid APK we publish MUST be signed (release
      # key). F-Droid's own build is unsigned on purpose — their infra has
      # no secrets, so IS_GITHUB_ACTION is never set there and they sign
      # with THEIR key; the reproducible-build comparison strips signatures
      # from both APKs before diffing, so our signature never affects the
      # byte match. But if OUR artifact ever came out unsigned or debug-keyed,
      # it could not be released — fail loudly instead of shipping it.
      - name: Verify fdroid APK is signed (release key)
        if: matrix.flavor == 'fdroid' && github.event.inputs.build_type != 'debug'
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          # Split-per-abi: verify EVERY per-ABI APK is signed with the release
          # key (never the debug key).
          for APK in build/app/outputs/flutter-apk/app-*-fdroid-release.apk; do
            echo "checking $APK"
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            echo "$CERTS"
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "FAIL: $APK is signed with the DEBUG key, not the release key"
              exit 1
            fi
          done
          echo "fdroid APKs signed with release key: OK"

      - name: Build AAB (Play Store)
        if: matrix.flavor == 'play' && github.event.inputs.build_type != 'debug'
        run: flutter build appbundle --flavor play --release $DEFINES

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclavd-${{ matrix.flavor }}-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          if-no-files-found: error

      - name: Upload AAB artifact (Play Store)
        if: matrix.flavor == 'play' && github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: enclavd-play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

  # iOS runner: present in the repo (ios/) so the project is cross-platform
  # from day one, but compilation needs a macOS runner. Gate it behind the
  # build_ios dispatch input so the Android pipeline stays fast. No codesign:
  # signing is added when the iOS release pipeline is actually started.
  ios:
    if: github.event.inputs.build_ios == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compile iOS runner (no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: enclavd-ios
          path: build/ios/iphoneos/*.app
          if-no-files-found: error
