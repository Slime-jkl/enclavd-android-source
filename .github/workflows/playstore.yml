name: Build Play Store

on:
  # Allows you to manually trigger this workflow from the GitHub Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Decode Keystore File
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release-keystore.jks

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Build and Sign Release APK & AAB
      env:
        IS_GITHUB_ACTION: "true" # Only signs on github actions, fdroid = unsigned
        SIGNING_KEY_FILE: "release-keystore.jks"
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease bundleRelease --stacktrace

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: enclavd-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Signed Release AAB Artifact (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: enclavd-release-aab
        path: app/build/outputs/bundle/release/app-release.aab