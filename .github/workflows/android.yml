name: Build Android Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Build Release AAB (Play Store) & APK
      # Generates both the Play Store Bundle (.aab) and standard Release APK (.apk)
      run: ./gradlew bundleRelease assembleRelease --stacktrace

    - name: Sign Release Binaries
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: enclavd-release-apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}