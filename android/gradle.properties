org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Flutter's gradle plugin enables minify + resource shrinking on RELEASE by
# default (FlutterPluginUtils.shouldShrinkResources, prop 'shrink').
# Resource shrinking strips/renames drawables that are only referenced by
# runtime string — flutter_local_notifications resolves its icon via
# getIdentifier("ic_stat_enclavd") and validate it at initialize(): when R8
# removes it, initialize() errors, the permission request never runs, and
# message notifications silently never appear (no popup, OS shows them off).
# shrink=false keeps the plugin from touching release minify/shrink at all;
# the Dart code is AOT-compiled anyway, so R8 only ever shaved glue code.
shrink=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# F-Droid ABI splits: Flutter's gradle plugin applies its own version-code
# scheme (base * 1000 + abi 1/2/4) to split APKs. F-Droid requires
# base * 10 + abi (1/2/3) instead — implemented in app/build.gradle.kts via
# the new Variant API. This property disables Flutter's built-in override so
# ours is the single writer (no ordering race between the two callbacks).
force-version-code-ignoring-abi=true
