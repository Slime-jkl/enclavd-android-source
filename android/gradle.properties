org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# R8 stays on for release (Play DEX thresholds); resource shrinking is off in app/build.gradle.kts.
shrink=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# F-Droid ABI splits: Flutter's gradle plugin applies its own version-code
# scheme (base * 1000 + abi 1/2/4) to split APKs. F-Droid requires
# base * 10 + abi (1/2/3) instead - implemented in app/build.gradle.kts via
# the new Variant API. This property disables Flutter's built-in override so
# ours is the single writer (no ordering race between the two callbacks).
force-version-code-ignoring-abi=true
