name: enclavd
description: "Enclavd - native app (Flutter). One codebase for Android and iOS, talking to the api/v1 backend."
publish_to: "none"
version: 2.0.4+204

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.1.2
  audioplayers: ^6.0.0
  image: ^4.2.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  home_widget: ^0.9.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  gal: ^2.3.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  unifiedpush: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          weight: 400
          style: italic

  assets:
    - assets/images/default-avatar.png
    - assets/images/default-logo.png
    - assets/images/no-image.jpg
    - assets/images/enclavd-logo-white.png
    - assets/sounds/
