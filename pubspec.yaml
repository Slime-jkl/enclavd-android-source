name: enclavd
description: "Enclavd — native app (Flutter). One codebase for Android and iOS, talking to the api/v1 backend."
publish_to: "none"
version: 0.6.1+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Minimal external deps: SharedPreferences (session cookie jar),
  # path_provider (image disk cache dir), font_awesome_flutter (the site's
  # own icon set — visual fidelity), image_picker (post image attach),
  # audioplayers (the site's like/action sound files), image (pure-Dart
  # pixel work for the post-image editor — crop/filter/resize, no native
  # code) and url_launcher (post-body links open in the system browser,
  # the site's target=_blank). The plugin ones are flutter.dev or the
  # canonical community package; everything else is SDK.
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.1.2
  audioplayers: ^6.0.0
  image: ^4.2.0
  url_launcher: ^6.3.0
  # Message notifications: badge pings (SSE message_unread) surface as
  # device notifications with a reply action from the drawer.
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  # In-app YouTube playback: post-card embeds load the real youtube-nocookie
  # embed player in a WebView (plays inline, streamed from YouTube) instead
  # of redirecting to the YouTube app. flutter.dev first-party plugin.
  webview_flutter: ^4.14.1
  # Direct import (AndroidWebViewController.setMediaPlaybackRequiresUserGesture
  # — allows the embed to autoplay after the thumbnail tap).
  webview_flutter_android: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          weight: 400
          style: italic

  assets:
    - assets/images/default-avatar.png
    - assets/images/default-logo.png
    - assets/images/no-image.jpg
    - assets/images/enclavd-logo-white.png
    - assets/sounds/
