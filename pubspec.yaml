name: enclavd
description: "Enclavd — native app (Flutter). One codebase for Android and iOS, talking to the api/v1 backend."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Minimal external deps: SharedPreferences (session cookie jar) and
  # path_provider (image disk cache dir). Both are flutter.dev's own
  # first-party plugins — everything else uses the Flutter SDK + dart:io.
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-Italic.ttf
          weight: 400
          style: italic

  assets:
    - assets/images/default-avatar.png
    - assets/images/default-logo.png
